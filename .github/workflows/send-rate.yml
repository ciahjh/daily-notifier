name: Send exchange rate

on:
  schedule:
    # 매일 23:47 UTC = 한국 시간 08:47 (정각을 피해 지연/누락을 줄이고 09:00 전후에 도착하도록 설정)
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python send_rate.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
