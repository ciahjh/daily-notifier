name: Send rain alert

on:
  # 외부 스케줄러(cron-job.org)가 매일 05:47 KST에 workflow_dispatch API로 호출한다.
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python weather_alert.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          WEATHER_CHAT_ID: ${{ secrets.WEATHER_CHAT_ID }}
