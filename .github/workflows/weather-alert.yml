name: Send rain alert

on:
  schedule:
    # 매일 20:47 UTC = 한국 시간 05:47 (정각을 피해 지연/누락을 줄이고 06:00 전후에 도착하도록 설정)
    - cron: "47 20 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python weather_alert.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          WEATHER_CHAT_ID: ${{ secrets.WEATHER_CHAT_ID }}
